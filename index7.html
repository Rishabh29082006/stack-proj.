<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whispr - Listen to Some Fun Talks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-[#2D1B18] text-white min-h-screen overflow-x-hidden selection:bg-orange-500 selection:text-white">

  <!-- Background Decorative Gradients -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-40 z-0">
    <div class="absolute -bottom-20 -left-20 w-[600px] h-[600px] rounded-full bg-gradient-to-tr from-orange-600 via-amber-600 to-yellow-500 blur-3xl"></div>
    <div class="absolute top-20 -right-20 w-[500px] h-[500px] rounded-full bg-gradient-to-bl from-orange-500 to-amber-700 blur-3xl"></div>
  </div>

  <div class="relative z-10 max-w-7xl mx-auto px-6 py-4 flex flex-col justify-between min-h-screen">
    
    <!-- Navbar -->
    <header class="flex items-center justify-between py-4">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-[#2D1B18] font-bold text-sm">w</div>
        <span class="text-xl font-bold tracking-tight">whispr</span>
      </div>
      
      <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-300">
        <a href="#" class="hover:text-white transition">About us</a>
        <a href="#" class="hover:text-white transition">Provide</a>
        <a href="#" class="hover:text-white transition">Top Creators</a>
        <a href="#" class="hover:text-white transition">Let's Join Us</a>
      </nav>

      <div class="flex items-center space-x-4">
        <button class="px-5 py-2 text-sm font-semibold border border-orange-500 rounded-full hover:bg-orange-500/10 transition">Sign Up</button>
        <button class="px-5 py-2 text-sm font-semibold bg-orange-500 text-white rounded-full hover:bg-orange-600 transition shadow-lg shadow-orange-500/30">Login</button>
      </div>
    </header>

    <!-- Hero Section Content -->
    <main class="relative flex-1 flex flex-col justify-center items-center my-12">
      
      <!-- Big Headings Grid -->
      <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-4 items-center relative">
        
        <!-- Left Text: LISTEN TO SOME FUN TALKS! -->
        <div class="lg:col-span-7 z-20 flex flex-col justify-center">
          <h1 class="text-5xl sm:text-7xl lg:text-8xl font-black uppercase tracking-tight leading-[0.9] drop-shadow-md">
            LISTEN TO <br>
            SOME FUN <br>
            <span class="text-orange-100">TALKS!</span>
          </h1>
        </div>

        <!-- Right Text: EVERY VOICE REALLY MATTERS! -->
        <div class="lg:col-span-5 z-20 flex flex-col lg:items-end justify-center lg:text-right mt-6 lg:mt-0">
          <h2 class="text-2xl sm:text-3xl font-black uppercase tracking-wide leading-tight max-w-xs">
            EVERY VOICE REALLY <span class="text-orange-400">MATTERS !</span>
          </h2>
        </div>

      </div>

      <!-- Central Imagery & Floating Card Overlay -->
      <div class="absolute inset-0 flex justify-center items-center pointer-events-none z-10 mt-16">
        <div class="relative w-[340px] sm:w-[420px] h-[380px] sm:h-[460px] rounded-3xl overflow-hidden shadow-2xl border-4 border-orange-500/30 pointer-events-auto">
          <!-- Central Image Placeholder -->
          <img src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&q=80&w=800" alt="Podcast Host" class="w-full h-full object-cover object-center">
          
          <!-- Floating Members Card -->
          <div class="absolute bottom-6 right-6 bg-white text-gray-900 p-5 rounded-2xl shadow-xl w-56 backdrop-blur-md bg-opacity-95">
            <p class="text-xs font-semibold text-gray-500 mb-2">Our Members</p>
            <div class="flex items-center space-x-2 mb-4">
              <div class="flex -space-x-2 overflow-hidden">
                <img class="inline-block h-7 w-7 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" alt="">
                <img class="inline-block h-7 w-7 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=100" alt="">
                <img class="inline-block h-7 w-7 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=100" alt="">
              </div>
              <span class="text-xs font-bold bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full">+10k</span>
            </div>
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-xl font-black tracking-tight text-gray-900">100K+</h3>
                <p class="text-[11px] text-gray-500 font-medium">Monthly Listeners</p>
              </div>
              <button class="w-9 h-9 rounded-full bg-gradient-to-tr from-orange-500 to-amber-500 flex items-center justify-center text-white shadow-md hover:scale-105 transition">
                <svg class="w-4 h-4 rotate-45" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>

        </div>
      </div>

    </main>

  </div>

</body>
</html>
